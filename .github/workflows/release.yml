name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.7.13). Must match Version in src/TerminalV/TerminalV.csproj'
        required: true
        default: 'v0.7.13'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/checkout@v4
        with:
          repository: XYphrodite/self-update-kit
          ref: v0.3.0
          path: kit-tmp

      - name: Move self-update-kit next to the repo
        shell: pwsh
        run: |
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $parent = Split-Path $workspace -Parent
          $source = [IO.Path]::GetFullPath((Join-Path $workspace 'kit-tmp'))
          $destination = [IO.Path]::GetFullPath((Join-Path $parent 'self-update-kit'))
          if ((Split-Path $source -Parent) -ne $workspace -or
              (Split-Path $destination -Parent) -ne $parent -or
              (Split-Path $destination -Leaf) -ne 'self-update-kit') {
            throw 'Unexpected self-update-kit staging paths'
          }
          if (Test-Path -LiteralPath $destination) { throw 'self-update-kit destination already exists' }
          Move-Item -LiteralPath $source -Destination $destination

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check tag matches project version
        shell: pwsh
        run: |
          [xml]$p = Get-Content src/TerminalV/TerminalV.csproj
          $v = $p.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$v" -ne $env:TAG) { throw "Tag $env:TAG != csproj Version $v" }

      - name: Verify terminal rendering and restoration
        shell: pwsh
        working-directory: ui
        run: |
          npm ci --no-fund --no-audit
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
          node --test --test-concurrency=1 --test-name-pattern="scroll position when reopening xterm panes|terminal geometry|synchronized TUI output|terminal scrolling survives" tests/selection.test.js
          if ($LASTEXITCODE -ne 0) { throw "Terminal rendering regression tests failed" }

      - name: Publish package
        shell: pwsh
        run: ./scripts/publish.ps1 -OutputDirectory "artifacts/release-$env:TAG"

      - name: Verify full and light packages before release
        shell: pwsh
        run: |
          $version = $env:TAG.Substring(1)
          $releaseDirectory = "artifacts/release-$env:TAG"
          dotnet run --project tests/TerminalV.Package.Tests -c Release -- "$releaseDirectory/TerminalV-win-x64.zip" $version "$releaseDirectory/verified-full"
          if ($LASTEXITCODE -ne 0) { throw "Full package checks failed" }
          dotnet run --project tests/TerminalV.Package.Tests -c Release -- "$releaseDirectory/TerminalV-win-x64-light.zip" $version "$releaseDirectory/verified-light"
          if ($LASTEXITCODE -ne 0) { throw "Light package checks failed" }

      - name: Verify session persistence before release
        shell: pwsh
        run: |
          dotnet run --project tests/TerminalV.Data.Tests -c Release
          if ($LASTEXITCODE -ne 0) { throw "Session database checks failed" }
          dotnet run --project tests/TerminalV.Window.Tests -c Release
          if ($LASTEXITCODE -ne 0) { throw "Window state checks failed" }
          dotnet run --project tests/TerminalV.Pty.Tests -c Release
          if ($LASTEXITCODE -ne 0) { throw "Session host checks failed" }
          $env:TERMINALV_TEST_APP_ROOT = (Resolve-Path "artifacts/release-$env:TAG/verified-full/wwwroot").Path
          Push-Location ui
          try {
            node --test --test-concurrency=1 tests/session-persistence.test.js tests/session-management.test.js tests/notifications.test.js
            if ($LASTEXITCODE -ne 0) { throw "Session persistence timing checks failed" }
            node --test --test-concurrency=1 --test-name-pattern="cold restore|close protection|working directory|session management|notification|search in the built|launch profiles|quick launch menu|split panes" tests/selection.test.js
            if ($LASTEXITCODE -ne 0) { throw "Session interface checks failed" }
          } finally { Pop-Location }

      - name: Verify extensions before release
        shell: pwsh
        run: |
          dotnet run --project tests/TerminalV.Extensions.Tests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Extension host checks failed' }
          node --test --test-concurrency=1 ui/tests/extensions.test.js
          if ($LASTEXITCODE -ne 0) { throw 'Extension UI API checks failed' }
          foreach ($variant in @('full', 'light')) {
            $env:TERMINALV_TEST_APP_ROOT = (Resolve-Path "artifacts/release-$env:TAG/verified-$variant/wwwroot").Path
            node --test --test-concurrency=1 --test-name-pattern='extension interface' ui/tests/selection.test.js
            if ($LASTEXITCODE -ne 0) { throw "Extension interface checks failed in $variant package" }
          }

      - name: Package example extension
        shell: pwsh
        run: |
          $releaseDirectory = "artifacts/release-$env:TAG"
          $package = "$releaseDirectory/extensions/terminalv.hello"
          New-Item -ItemType Directory -Force -Path "$package/host" | Out-Null
          dotnet build examples/extensions/terminalv.hello/host/HelloExtension.csproj -c Release -o "$package/host"
          if ($LASTEXITCODE -ne 0) { throw 'Example extension build failed' }
          Copy-Item examples/extensions/terminalv.hello/extension.json $package
          Copy-Item examples/extensions/terminalv.hello/ui $package -Recurse
          $zip = "$releaseDirectory/terminalv.hello.zip"
          Compress-Archive -Path $package -DestinationPath $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$zip.sha256" -Value "$hash  terminalv.hello.zip" -Encoding ascii

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = "docs/releases/$env:TAG.md"
          gh release create $env:TAG --verify-tag --title "TerminalV $env:TAG" --notes-file $notes `
            "artifacts/release-$env:TAG/TerminalV-win-x64.zip" `
            "artifacts/release-$env:TAG/TerminalV-win-x64.zip.sha256" `
            "artifacts/release-$env:TAG/TerminalV-win-x64-light.zip" `
            "artifacts/release-$env:TAG/TerminalV-win-x64-light.zip.sha256" `
            "artifacts/release-$env:TAG/terminalv.hello.zip" `
            "artifacts/release-$env:TAG/terminalv.hello.zip.sha256"
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed' }

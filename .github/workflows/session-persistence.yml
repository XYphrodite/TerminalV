name: session persistence

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'codex/session-persistence-*']

permissions:
  contents: read

concurrency:
  group: session-persistence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: TerminalV
    steps:
      - uses: actions/checkout@v4
        with:
          path: TerminalV

      - uses: actions/checkout@v4
        with:
          repository: XYphrodite/self-update-kit
          ref: v0.3.0
          path: self-update-kit

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: TerminalV/ui/package-lock.json

      - name: Build Windows application and current UI
        run: dotnet build src/TerminalV/TerminalV.csproj -c Release

      - name: Check SQLite persistence and exclusive desktop ownership
        run: dotnet run --project tests/TerminalV.Data.Tests -c Release

      - name: Check isolated session host and ConPTY restoration
        run: dotnet run --project tests/TerminalV.Pty.Tests -c Release

      - name: Check save timing with real xterm
        working-directory: TerminalV/ui
        run: node --test --test-concurrency=1 tests/session-persistence.test.js tests/session-management.test.js tests/notifications.test.js

      - name: Check built desktop session interface in browser
        working-directory: TerminalV/ui
        run: node --test --test-concurrency=1 --test-name-pattern='close protection|working directory|session management|notification' tests/selection.test.js

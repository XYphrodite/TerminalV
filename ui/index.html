<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TerminalV</title>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="sidebar-head">
          <span class="sessions-label">Сессии</span>
        </div>
        <div id="tabs" class="tabs" role="tablist"></div>
        <div class="sidebar-foot">
          <button id="new-tab" type="button">
            <span class="plus">+</span>
            Новая вкладка
          </button>
          <div class="hint">Ctrl+Shift+T</div>
        </div>
      </aside>
      <main id="main">
        <div id="panes"></div>
        <div id="empty" class="empty hidden">
          <div class="empty-mark">V</div>
          <div class="empty-title">Нет открытых сессий</div>
          <div class="empty-sub">Вертикальные вкладки слева, PowerShell внутри.</div>
          <button type="button" id="empty-new">Запустить оболочку</button>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

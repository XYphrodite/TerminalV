<!doctype html>
<meta charset="utf-8">
<style>html, body { margin: 0; height: 100%; } iframe { width: 100%; height: 100%; border: 0; display: block; }</style>
<script type="module">
  const source = await (await fetch("/app/index.html")).text();
  const results = [];
  const delay = (ms = 100) => new Promise(resolve => setTimeout(resolve, ms));
  window.addEventListener("error", event => document.body.dataset.testError = event.message);
  window.addEventListener("unhandledrejection", event => document.body.dataset.testError = String(event.reason));
  // Recorded ConPTY/PowerShell startup clears the screen and homes the cursor.
  // The old automatic cold-start path therefore destroys the short saved screen.
  const startup = "\x1b[?9001h\x1b[?1004h\x1b[?25l\x1b[2J\x1b[m\x1b[H\x1b]0;PowerShell\x07\x1b[?25hPS C:\\new-process> ";
  const sessions = [
    { id: "plain", title: "Обычная сессия", customTitle: "Мой проект", active: true,
      cwd: "C:\\Проект", group: "Работа", color: "green", pinned: true, buffer: "PLAIN BEFORE REBOOT\r\nLAST RESULT" },
    { id: "long", title: "История", shell: "pwsh", cwd: "D:\\Logs",
      buffer: "LONG HISTORY START\r\n" + "old output\r\n".repeat(80) + "LONG HISTORY END" },
    { id: "alternate", title: "Приложение", shell: "powershell", cwd: "C:\\Tui",
      buffer: "NORMAL BEFORE TUI\r\n\x1b[?1049hALTERNATE BEFORE REBOOT" },
    { id: "hidden", title: "Скрытая", hidden: true, muted: true, cwd: "C:\\Hidden", buffer: "HIDDEN BEFORE REBOOT" },
    { id: "profile", title: "Профиль", shell: "powershell", cwd: "C:\\Server",
      startupCommand: "echo original-command", buffer: "PROFILE BEFORE REBOOT" },
    { id: "linux", title: "Ubuntu", shell: "wsl", wslDistribution: "Ubuntu", buffer: "LINUX BEFORE REBOOT" }
  ];
  const layouts = [
    { axis: "columns", ratio: .5, first: { sessionId: "plain" }, second: { sessionId: "long" } },
    ...["alternate", "profile", "linux"].map(sessionId => ({ sessionId }))
  ];
  const markers = {
    plain: ["PLAIN BEFORE REBOOT", "LAST RESULT"],
    long: ["LONG HISTORY START", "LONG HISTORY END"],
    alternate: ["NORMAL BEFORE TUI", "ALTERNATE BEFORE REBOOT", "\x1b[?1049h"],
    hidden: ["HIDDEN BEFORE REBOOT"], profile: ["PROFILE BEFORE REBOOT"], linux: ["LINUX BEFORE REBOOT"]
  };
  function equal(actual, expected) {
    if (JSON.stringify(actual) !== JSON.stringify(expected))
      throw new Error(`Expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
  }
  function contains(buffer, marker, id) {
    if (!buffer.includes(marker)) throw new Error(`${id} lost ${JSON.stringify(marker)}; saved ${JSON.stringify(buffer.slice(-300))}`);
  }
  function preserved(saved) {
    equal(saved.sessions.map(tab => tab.id), sessions.map(tab => tab.id));
    for (const tab of saved.sessions)
      for (const marker of markers[tab.id]) contains(tab.buffer, marker, tab.id);
    for (const original of sessions) {
      const restored = saved.sessions.find(tab => tab.id === original.id);
      for (const key of ["cwd", "customTitle", "group", "color", "shell", "wslDistribution", "startupCommand"])
        equal(restored[key] || null, original[key] || null);
      for (const key of ["active", "hidden", "muted", "pinned"])
        equal(restored[key], Boolean(original[key]));
    }
    equal(saved.layouts, layouts);
  }
  async function setup(overrides = {}) {
    const frame = document.createElement("iframe");
    const init = { sessions, layouts, liveIds: [], cwdTrackingSupported: true, ...overrides };
    frame.srcdoc = source.replace("<head>", `<head><base href="${location.origin}/app/"><script>window.testInit = ${JSON.stringify(init).replaceAll("<", "\\u003c")}; window.testCreateOutput = ${JSON.stringify(startup)};<\/script><script src="/tests/search-host.js"><\/script>`);
    const loaded = new Promise(resolve => frame.addEventListener("load", resolve, { once: true }));
    document.body.append(frame);
    await loaded;
    const app = frame.contentWindow, doc = frame.contentDocument;
    let sequence = 0;
    const s = { frame, app, doc,
      messages: type => app.hostMessages.filter(message => message.type === type),
      pane: id => doc.querySelector(`.pane[data-id="${id}"]`),
      async flush() {
        const requestId = `cold-restore-${++sequence}`;
        app.terminalvFlush(requestId);
        for (let attempt = 0; attempt < 40; attempt++) {
          const saved = s.messages("persist-sessions").find(message => message.requestId === requestId);
          if (saved) return structuredClone(saved);
          await delay(25);
        }
        throw new Error(`No completed flush for ${requestId}; errors: ${JSON.stringify(app.hostErrors)}`);
      }
    };
    await delay();
    return s;
  }
  async function check(name, run, overrides) {
    document.body.dataset.testProgress = name;
    let s;
    try {
      s = await setup(overrides);
      await run(s);
      equal(s.app.hostErrors, []);
      results.push({ name, ok: true });
    } catch (error) { results.push({ name, ok: false, error: error.stack }); }
    finally { s?.frame.remove(); }
  }

  await check("cold startup never creates replacement shells that erase saved short, long or alternate screens", async s => {
    // Check the actual persisted text first: an accidental create invokes the
    // realistic clear/home startup above, so this detects the original data loss.
    preserved(await s.flush());
    equal(s.messages("create").length, 0);
    equal(s.messages("attach").length, 0);
    equal(s.messages("write").length, 0);
    for (const tab of sessions)
      equal(s.pane(tab.id).querySelector(".overlay").classList.contains("visible"), true);
    equal(s.doc.querySelector(".pane.active").dataset.id, "plain");
    equal([...s.doc.querySelectorAll(".pane.visible")].map(pane => pane.dataset.id), ["plain", "long"]);
  });

  await check("correlated flush and a second cold restore retain all session metadata, screens and split layout", async s => {
    const saved = await s.flush();
    preserved(saved);
    const reopened = await setup({ sessions: saved.sessions, layouts: saved.layouts });
    try {
      preserved(await reopened.flush());
      equal(reopened.messages("create").length, 0);
      equal(reopened.messages("attach").length, 0);
      equal(reopened.app.hostErrors, []);
    } finally { reopened.frame.remove(); }
  });

  await check("live sessions still attach and a new tab starts without replacing offline saved sessions", async s => {
    equal(s.messages("attach").map(message => message.id), ["plain"]);
    equal(s.messages("create").length, 0);
    s.app.sendHost({ type: "data", id: "plain", data: "CURRENT LIVE REPLAY", replay: true });
    const saved = await s.flush();
    contains(saved.sessions.find(tab => tab.id === "plain").buffer, "CURRENT LIVE REPLAY", "plain");
    s.doc.getElementById("new-tab").click();
    const created = s.messages("create");
    equal(created.length, 1);
    equal(created[0].cwd, "C:\\Проект");
    equal(sessions.some(tab => tab.id === created[0].id), false);
    const after = await s.flush();
    equal(after.sessions.length, sessions.length + 1);
    for (const tab of after.sessions.filter(tab => markers[tab.id] && tab.id !== "plain"))
      for (const marker of markers[tab.id]) contains(tab.buffer, marker, tab.id);
  }, { liveIds: ["plain"] });

  await check("explicit restart creates one process with the saved directory and leaves other snapshots intact", async s => {
    const button = s.pane("plain").querySelector(".overlay button");
    button.click(); button.click();
    const created = s.messages("create");
    equal(created.length, 1);
    equal(created[0].id, "plain");
    equal(created[0].cwd, "C:\\Проект");
    equal(s.pane("plain").querySelector(".overlay").classList.contains("visible"), false);
    await delay(); // The mock process delivers startup output in a queued microtask.
    const saved = await s.flush();
    contains(saved.sessions.find(tab => tab.id === "plain").buffer, "PS C:\\new-process>", "plain");
    for (const tab of saved.sessions.filter(tab => tab.id !== "plain"))
      for (const marker of markers[tab.id]) contains(tab.buffer, marker, tab.id);
  });

  document.body.dataset.testResult = btoa(unescape(encodeURIComponent(JSON.stringify(results))));
</script>

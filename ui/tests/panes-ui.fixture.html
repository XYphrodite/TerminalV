<!doctype html>
<meta charset="utf-8">
<style>html, body { margin: 0; height: 100%; } iframe { width: 100%; height: 100%; border: 0; display: block; }</style>
<script type="module">
  const source = await (await fetch("/app/index.html")).text();
  const results = [];
  const delay = (ms = 120) => new Promise((resolve) => setTimeout(resolve, ms));
  const leaf = (sessionId) => ({ sessionId });
  const branch = (first, second, axis = "columns", ratio = .5) => ({ axis, ratio, first, second });
  function equal(actual, expected) {
    if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error(`Expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
  }
  const sessions = [
    { id: "a", title: "Muse — разработка", active: true, cwd: "C:\\Проект", group: "TerminalV", shell: "powershell", startupCommand: "muse" },
    { id: "b", title: "Логи сервера", color: "green" },
    { id: "other", title: "Отдельная сессия" }
  ];
  async function setup(overrides = {}) {
    const frame = document.createElement("iframe");
    const init = { sessions, layouts: [branch(leaf("a"), leaf("b")), leaf("other")], liveIds: ["a", "b", "other"], ...overrides };
    frame.srcdoc = source.replace("<head>", `<head><base href="${location.origin}/app/"><script>window.testInit = ${JSON.stringify(init).replaceAll("<", "\\u003c")};<\/script><script src="/tests/search-host.js"><\/script>`);
    const loaded = new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
    document.body.append(frame);
    await loaded;
    await delay();
    const app = frame.contentWindow, doc = frame.contentDocument;
    const s = { frame, app, doc, clipboard: "",
      pane: (id) => [...doc.querySelectorAll(".pane")].find((p) => p.dataset.id === id),
      row: (id) => [...doc.querySelectorAll(".tab")].find((p) => p.dataset.id === id),
      active: () => doc.querySelector(".pane.active")?.dataset.id,
      visible: () => [...doc.querySelectorAll(".pane.visible")].map((p) => p.dataset.id),
      messages: (type) => app.hostMessages.filter((m) => m.type === type),
      saved: () => { app.terminalvFlush(); return structuredClone(app.hostMessages.filter((m) => m.type === "persist-sessions").at(-1)); },
      key: (target, key, options = {}) => target.dispatchEvent(new app.KeyboardEvent("keydown", { key, bubbles: true, cancelable: true, ...options })),
      button: (id) => doc.getElementById(id)
    };
    Object.defineProperty(app.navigator, "clipboard", { configurable: true, value: { readText: async () => s.clipboard, writeText: async () => {} } });
    return s;
  }
  async function check(name, run, overrides) {
    document.body.dataset.testProgress = name;
    const s = await setup(overrides);
    try { await run(s); equal(s.app.hostErrors, []); results.push({ name, ok: true }); }
    catch (error) { results.push({ name, ok: false, error: error.stack }); }
    finally { s.frame.remove(); }
  }

  await check("restoration shows a split view, retains IDs and attaches each process only once", async (s) => {
    equal(s.visible(), ["a", "b"]);
    equal(s.active(), "a");
    equal(s.messages("attach").map((m) => m.id), ["a", "b", "other"]);
    equal(s.messages("create").length, 0);
    const a = s.pane("a").getBoundingClientRect(), b = s.pane("b").getBoundingClientRect();
    equal(a.right < b.left, true);
    equal(Math.abs(a.height - b.height) < 1, true);
    equal(s.pane("other").inert, true);
    equal(s.doc.querySelectorAll(".pane-divider").length, 1);
  });

  await check("split buttons create one ordinary shell in the selected cwd without repeating profile startup", async (s) => {
    s.button("split-down").click();
    await delay();
    equal(s.messages("create").length, 1);
    const created = s.messages("create")[0];
    equal(created.cwd, "C:\\Проект");
    equal(created.shell, undefined);
    equal(created.startupCommand, undefined);
    equal(s.visible().length, 3);
    equal(s.active(), created.id);
    const saved = s.saved();
    equal(saved.layouts[0].first.axis, "rows");
    equal(saved.layouts[0].first.second.sessionId, created.id);
    equal(saved.sessions.find((tab) => tab.id === created.id).group, "TerminalV");
    equal(s.messages("write").length, 0);
  });

  await check("Alt+Shift physical keys split in either layout and ignore held keys", async (s) => {
    const input = s.pane("a").querySelector("textarea");
    s.key(input, "+", { code: "Equal", altKey: true, shiftKey: true });
    s.key(input, "+", { code: "Equal", altKey: true, shiftKey: true, repeat: true });
    await delay();
    equal(s.messages("create").length, 1);
    s.key(s.pane(s.active()).querySelector("textarea"), "_", { code: "Minus", altKey: true, shiftKey: true });
    await delay();
    equal(s.messages("create").length, 2);
    equal(s.visible().length, 3);
    equal(s.messages("write").length, 0);
  }, { layouts: [leaf("a"), leaf("b"), leaf("other")] });

  await check("directional navigation and clicking a pane preserve mounted terminals and use only that input target", async (s) => {
    const terminal = s.pane("a").querySelector(".xterm");
    s.key(s.pane("a").querySelector("textarea"), "ArrowRight", { altKey: true });
    equal(s.active(), "b");
    // The next keystroke may arrive before a paint; focus must already be correct.
    equal(s.doc.activeElement === s.pane("b").querySelector("textarea"), true);
    s.clipboard = "one paste";
    s.key(s.doc.activeElement, "М", { code: "KeyV", ctrlKey: true, shiftKey: true });
    await delay();
    equal(s.messages("write").map(({ id, data }) => ({ id, data })), [{ id: "b", data: "one paste" }]);
    s.pane("a").querySelector(".pane-head").click();
    await delay();
    equal(s.active(), "a");
    equal(s.pane("a").querySelector(".xterm") === terminal, true);
    equal(s.visible(), ["a", "b"]);
    equal(s.messages("create").length, 0);
  });

  await check("switching sidebar views and returning never restarts or loses a split", async (s) => {
    const terminal = s.pane("b").querySelector(".xterm");
    s.row("other").click();
    equal(s.visible(), ["other"]);
    equal(s.doc.querySelectorAll(".pane-divider").length, 0);
    s.row("b").click();
    equal(s.visible(), ["a", "b"]);
    equal(s.pane("b").querySelector(".xterm") === terminal, true);
    equal(s.active(), "b");
    equal(s.messages("create").length, 0);
    equal(s.messages("attach").length, 3);
  });

  await check("right-click paste targets the panel under the pointer, not its previously active neighbor", async (s) => {
    s.clipboard = "targeted paste";
    const host = s.pane("b").querySelector(".terminal-host");
    host.dispatchEvent(new s.app.PointerEvent("pointerdown", { button: 2, bubbles: true }));
    host.dispatchEvent(new s.app.MouseEvent("contextmenu", { bubbles: true, cancelable: true }));
    await delay();
    equal(s.active(), "b");
    equal(s.messages("write").map(({ id, data }) => ({ id, data })), [{ id: "b", data: "targeted paste" }]);
  });

  await check("a late clipboard reply cannot paste into a panel after keyboard focus moves", async (s) => {
    let resolveClipboard;
    Object.defineProperty(s.app.navigator, "clipboard", { configurable: true, value: {
      readText: () => new Promise((resolve) => { resolveClipboard = resolve; })
    } });
    const input = s.pane("a").querySelector("textarea");
    s.key(input, "М", { ctrlKey: true, code: "KeyV" });
    s.key(input, "ArrowRight", { altKey: true });
    resolveClipboard("first\nsecond");
    await delay();
    equal(s.doc.getElementById("paste-confirmation").open, false);
    equal(s.messages("write").length, 0);
    equal(s.active(), "b");
  });

  await check("keyboard resizing fits both PTYs and saves the proportion without sending input", async (s) => {
    const divider = s.doc.querySelector(".pane-divider");
    const a = s.pane("a").getBoundingClientRect().width;
    divider.focus();
    s.key(divider, "ArrowRight");
    await delay(230);
    equal(s.pane("a").getBoundingClientRect().width > a, true);
    equal(s.saved().layouts[0].ratio, .55);
    equal(s.messages("resize").some((m) => m.id === "a"), true);
    equal(s.messages("resize").some((m) => m.id === "b"), true);
    equal(s.doc.activeElement === divider, true);
    equal(s.messages("write").length, 0);
  });

  await check("pointer drag is clamped, commits once released and cannot resize a different view later", async (s) => {
    const divider = s.doc.querySelector(".pane-divider"), box = s.doc.getElementById("panes").getBoundingClientRect();
    // Synthetic pointer events have no OS pointer ID, so only capture is stubbed.
    divider.setPointerCapture = () => {};
    const pointer = (type, x) => divider.dispatchEvent(new s.app.PointerEvent(type, { pointerId: 4, button: 0, clientX: x, clientY: box.top + 30, bubbles: true }));
    pointer("pointerdown", box.left + box.width / 2);
    pointer("pointermove", box.left + box.width * .6);
    pointer("pointerup", box.left + box.width * .6);
    equal(Math.abs(s.saved().layouts[0].ratio - .6) < .001, true);
    pointer("pointermove", box.right + 1000);
    equal(Math.abs(s.saved().layouts[0].ratio - .6) < .001, true);
    pointer("pointerdown", box.left + box.width * .6);
    pointer("pointermove", box.right + 1000);
    pointer("pointercancel", box.right + 1000);
    equal(s.saved().layouts[0].ratio <= .9, true);
    const frozen = s.saved().layouts[0].ratio;
    s.row("other").click();
    pointer("pointermove", box.left);
    equal(s.saved().layouts[0].ratio, frozen);
    equal(s.messages("write").length, 0);
  });

  await check("closing an inactive pane asks for its session and cancellation leaves the layout intact", async (s) => {
    const before = s.saved().layouts;
    s.pane("b").querySelector(".pane-close").click();
    equal(s.active(), "a");
    equal(s.doc.querySelector("[data-close-name]").textContent, "Логи сервера");
    s.doc.querySelector("[data-close-cancel]").click();
    equal(s.saved().layouts, before);
    equal(s.messages("kill").length, 0);
    s.pane("b").querySelector(".pane-close").click();
    s.doc.querySelector("[data-close-confirm]").click();
    equal(s.messages("kill").map((m) => m.id), ["b"]);
    equal(s.visible(), ["a"]);
    equal(s.saved().layouts, [leaf("a"), leaf("other")]);
  });

  await check("closing the active pane chooses its neighbor; the final live pane still needs approval", async (s) => {
    s.key(s.pane("a").querySelector("textarea"), "Ц", { code: "KeyW", ctrlKey: true, shiftKey: true });
    s.doc.querySelector("[data-close-confirm]").click();
    equal(s.active(), "b");
    equal(s.visible(), ["b"]);
    s.row("b").querySelector(".tab-close").click();
    equal(s.doc.getElementById("close-confirmation").open, true);
    s.doc.querySelector("[data-close-cancel]").click();
    equal(s.messages("kill").map((m) => m.id), ["a"]);
  });

  await check("a process exiting during confirmation cannot kill a neighbor or collapse its view", async (s) => {
    s.pane("b").querySelector(".pane-close").click();
    s.app.sendHost({ type: "exit", id: "b", code: 0 });
    equal(s.doc.getElementById("close-confirmation").open, false);
    equal(s.visible(), ["a", "b"]);
    s.doc.querySelector("[data-close-confirm]").click();
    equal(s.messages("kill").length, 0);
    s.pane("b").querySelector(".pane-close").click();
    equal(s.visible(), ["a"]);
    equal(s.messages("kill").length, 0);
  });

  await check("hiding and detaching panels never kill, create or reattach a shell", async (s) => {
    s.row("a").querySelector(".tab-options").click();
    s.doc.querySelector("[data-session-hide]").click();
    equal(s.visible(), ["b"]);
    equal(s.active(), "b");
    s.button("hidden-sessions").click();
    s.row("a").click();
    equal(s.visible(), ["a"]);
    equal(s.messages("create").length, 0);
    equal(s.messages("kill").length, 0);
    equal(s.messages("attach").length, 3);
  });

  await check("detaching a panel leaves the same processes as separate views", async (s) => {
    s.button("detach-pane").click();
    equal(s.visible(), ["a"]);
    equal(s.saved().layouts, [leaf("b"), leaf("other"), leaf("a")]);
    s.row("b").click();
    equal(s.visible(), ["b"]);
    equal(s.messages("create").length, 0);
    equal(s.messages("kill").length, 0);
  });

  await check("layout restoration after window close reuses live processes without profile startup", async (s) => {
    s.button("split-down").click();
    await delay();
    const saved = s.saved();
    const restored = await setup({ sessions: saved.sessions, layouts: saved.layouts, liveIds: saved.sessions.map((tab) => tab.id) });
    try {
      equal(restored.visible().length, 3);
      equal(restored.active(), saved.sessions.find((tab) => tab.active).id);
      equal(restored.saved().layouts, saved.layouts);
      equal(restored.messages("create").length, 0);
      equal(restored.messages("attach").length, 4);
    } finally { restored.frame.remove(); }
  });

  await check("missing profile processes keep their screens and layout until explicit restart", async (s) => {
    equal(s.visible(), ["a", "b"]);
    equal(s.messages("create").length, 0);
    s.pane("a").querySelector(".overlay button").click();
    equal(s.messages("create").length, 1);
    equal(s.messages("create")[0].startupCommand, "muse");
    equal(s.visible(), ["a", "b"]);
  }, { sessions: sessions.slice(0, 2).map((tab) => ({ ...tab, shell: "powershell", buffer: "SAVED" })), liveIds: [] });

  await check("search, paste and close dialogs isolate split shortcuts and preserve their input target", async (s) => {
    s.button("search-btn").click();
    const search = s.doc.querySelector("[data-search-input]");
    s.key(search, "_", { code: "Minus", altKey: true, shiftKey: true });
    equal(s.messages("create").length, 0);
    s.doc.querySelector("[data-search-close]").click();
    s.clipboard = "first\nsecond";
    s.key(s.pane("a").querySelector("textarea"), "М", { code: "KeyV", ctrlKey: true });
    await delay();
    equal(s.doc.getElementById("paste-confirmation").open, true);
    s.key(s.doc, "_", { code: "Minus", altKey: true, shiftKey: true });
    s.button("split-down").click();
    equal(s.messages("create").length, 0);
    s.doc.querySelector("[data-paste-confirm]").click();
    equal(s.messages("write").map((m) => m.id), ["a"]);
    s.pane("b").querySelector(".pane-close").click();
    s.button("split-down").click();
    equal(s.messages("create").length, 0);
    s.doc.querySelector("[data-close-cancel]").click();
  });

  await check("an inactive visible pane may notify, but cannot steal focus or resize the active terminal alone", async (s) => {
    s.button("search-btn").click();
    const input = s.doc.querySelector("[data-search-input]");
    s.app.sendHost({ type: "data", id: "b", data: "\x07" });
    await delay();
    equal(s.messages("bell").map((m) => m.id), ["b"]);
    equal(s.doc.activeElement === input, true);
    s.pane("b").querySelector(".pane-head").click();
    await delay();
    equal(s.active(), "b");
    equal(s.doc.getElementById("terminal-search").hidden, true);
    equal(s.row("b").classList.contains("has-attention"), false);
  });

  await check("small windows disable further splitting, keep dividers bounded and render titles as text", async (s) => {
    s.frame.style.width = "420px";
    s.frame.style.height = "420px";
    s.app.sendHost({ type: "data", id: "b", data: "\x1b]0;<img onerror=bad()>\x07" });
    await delay();
    equal(s.button("split-right").disabled, true);
    s.button("split-right").click();
    equal(s.messages("create").length, 0);
    equal(s.doc.querySelector(".pane-head img"), null);
    equal(s.pane("b").querySelector(".pane-title").textContent, "<img onerror=bad()>");
    const box = s.doc.getElementById("panes").getBoundingClientRect();
    for (const id of s.visible()) equal(s.pane(id).getBoundingClientRect().right <= box.right + 1, true);
  });

  await check("all visible panes refit on zoom and sidebar changes, including an alternate-buffer TUI", async (s) => {
    s.app.sendHost({ type: "data", id: "b", data: "\x1b[?1049hTUI screen" });
    await delay();
    const before = s.messages("resize").length;
    s.key(s.pane("a").querySelector("textarea"), "+", { ctrlKey: true, code: "Equal" });
    await delay(250);
    const changed = s.messages("resize").slice(before);
    equal(changed.some((m) => m.id === "a"), true);
    equal(changed.some((m) => m.id === "b"), true);
    equal(changed.some((m) => m.id === "other"), false);
    equal(s.pane("b").querySelector(".terminal-host").classList.contains("tui-lock"), true);
    s.button("collapse-btn").click();
    await delay(300);
    for (const id of s.visible()) {
      const pane = s.pane(id).getBoundingClientRect(), host = s.pane(id).querySelector(".terminal-host").getBoundingClientRect();
      equal(host.left - pane.left < 20, true);
      equal(host.width > pane.width - 30, true);
    }
    equal(s.messages("write").length, 0);
  });

  if (new URL(location.href).searchParams.has("preview")) {
    const s = await setup({ layouts: [branch(leaf("a"), branch(leaf("b"), leaf("other"), "rows"))] });
    s.app.sendHost({ type: "data", id: "a", data: "PS C:\\Repos\\TerminalV> muse\r\n\r\nРазработка интерфейса\r\nПанели готовы к проверке.\r\n" });
    s.app.sendHost({ type: "data", id: "b", data: "PS C:\\Repos\\TerminalV> npm test\r\n\x1b[32mPASS\x1b[0m layout, focus, persistence\r\n" });
    s.app.sendHost({ type: "data", id: "other", data: "PS C:\\Repos\\TerminalV> git status\r\nOn branch main\r\nИзменения готовы к проверке.\r\n" });
    await delay();
  }
  document.body.dataset.testResult = btoa(unescape(encodeURIComponent(JSON.stringify(results))));
</script>

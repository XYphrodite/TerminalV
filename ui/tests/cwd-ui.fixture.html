<!doctype html>
<meta charset="utf-8">
<style>html, body { margin: 0; height: 100%; } iframe { width: 100%; height: 100%; border: 0; display: block; }</style>
<script type="module">
  const results = [];
  const delay = (ms = 150) => new Promise((resolve) => setTimeout(resolve, ms));
  const frame = document.createElement("iframe");
  const source = await (await fetch("/app/index.html")).text();
  const init = {
    cwdTrackingSupported: true,
    liveIds: ["first"],
    sessions: [
      { id: "first", title: "Muse", customTitle: "Мой проект", active: true, cwd: "C:\\старое" },
      { id: "second", title: "C:\\misleading-title", cwd: "D:\\saved" },
      { id: "unknown", title: "C:\\not-a-directory" }
    ]
  };
  frame.srcdoc = source.replace("<head>", `<head><base href="${location.origin}/app/"><script>window.testInit = ${JSON.stringify(init)};<\/script><script src="/tests/search-host.js"><\/script>`);
  const loaded = new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
  document.body.append(frame);
  await loaded;
  const app = frame.contentWindow;
  const doc = frame.contentDocument;
  const notice = doc.getElementById("cwd-notice");
  const created = () => app.hostMessages.filter((message) => message.type === "create");
  const activeId = () => doc.querySelector(".pane.active").dataset.id;
  const activate = (id) => doc.querySelector(`.tab[data-id="${id}"]`).click();
  const terminalInput = () => doc.querySelector(".pane.active .xterm-helper-textarea");
  const cwd = (id, path, notice) => app.sendHost({ type: "cwd", id, cwd: path, notice });
  function equal(actual, expected) {
    if (actual !== expected) throw new Error(`Expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
  }
  async function check(name, run) {
    try { await run(); results.push({ name, ok: true }); }
    catch (error) { results.push({ name, ok: false, error: error.stack }); }
  }
  await delay();

  await check("restoration keeps each directory and only reattaches shells that are still live", () => {
    equal(app.hostMessages.filter((m) => m.type === "attach").length, 1);
    equal(created().length, 0);
    for (const id of ["second", "unknown"])
      equal(doc.querySelector(`.pane[data-id="${id}"] .overlay`).classList.contains("visible"), true);
  });
  await check("explicit restart uses each restored directory without borrowing from another tab", () => {
    for (const id of ["second", "unknown"])
      doc.querySelector(`.pane[data-id="${id}"] .overlay button`).click();
    equal(created().length, 2);
    equal(created().find((m) => m.id === "second").cwd, "D:\\saved");
    equal(created().find((m) => m.id === "unknown").cwd, undefined);
  });
  await check("new tab button uses real cwd of a renamed active session, not title or inactive cwd", async () => {
    cwd("first", "C:\\Проект с пробелом\\[test] O'Brien");
    cwd("second", "D:\\other");
    doc.getElementById("new-tab").click();
    equal(created().at(-1).cwd, "C:\\Проект с пробелом\\[test] O'Brien");
    await delay();
    equal(doc.activeElement, terminalInput());
  });
  await check("Ctrl+Shift+T inherits directory in English and Russian layouts exactly once", async () => {
    for (const key of ["T", "Е"]) {
      activate("second");
      const count = created().length;
      terminalInput().dispatchEvent(new app.KeyboardEvent("keydown", {
        key, code: "KeyT", ctrlKey: true, shiftKey: true, bubbles: true, cancelable: true
      }));
      equal(created().length, count + 1);
      equal(created().at(-1).cwd, "D:\\other");
      await delay();
    }
  });
  await check("unknown directory is not guessed from terminal title or another tab", async () => {
    app.sendHost({ type: "data", id: "unknown", data: "\x1b]0;C:\\still-not-a-directory\x07" });
    await delay();
    activate("unknown");
    doc.getElementById("new-tab").click();
    equal(created().at(-1).cwd, undefined);
    cwd("unknown", "C:\\startup");
    activate("unknown");
    doc.getElementById("new-tab").click();
    equal(created().at(-1).cwd, "C:\\startup");
  });
  await check("missing-folder fallback is contextual, literal, dismissible and does not steal focus", async () => {
    const id = activeId();
    await delay();
    const focused = doc.activeElement;
    const text = "Папка <img src=x onerror=alert(1)> недоступна. Открыта домашняя папка.";
    cwd(id, "C:\\Users\\Test", text);
    equal(notice.hidden, false);
    equal(notice.querySelector("span").textContent, text);
    equal(notice.querySelector("img"), null);
    equal(doc.activeElement, focused);
    equal(doc.getElementById("panes").getBoundingClientRect().top >= notice.getBoundingClientRect().bottom, true);
    cwd(id, "C:\\Users\\Test"); // A following prompt must not erase the warning immediately.
    equal(notice.hidden, false);
    activate("first");
    equal(notice.hidden, true);
    activate(id);
    equal(notice.hidden, false);
    notice.querySelector("button").click();
    equal(notice.hidden, true);
    doc.getElementById("new-tab").click();
    equal(created().at(-1).cwd, "C:\\Users\\Test");
  });
  await check("restart keeps the latest cwd and persistence stores metadata independently of titles", async () => {
    activate("second");
    app.sendHost({ type: "exit", id: "second", code: 0 });
    doc.querySelector('.pane.active .overlay button').click();
    equal(created().at(-1).id, "second");
    equal(created().at(-1).cwd, "D:\\other");
    const requestId = "cwd-after-restart";
    app.terminalvFlush(requestId);
    for (let attempt = 0; attempt < 20 && !app.hostMessages.some(m => m.type === "persist-sessions" && m.requestId === requestId); attempt++) {
      await delay();
    }
    const records = app.hostMessages.find(m => m.type === "persist-sessions" && m.requestId === requestId).sessions;
    equal(records.find((m) => m.id === "first").cwd, "C:\\Проект с пробелом\\[test] O'Brien");
    equal(records.find((m) => m.id === "first").customTitle, "Мой проект");
    equal(records.find((m) => m.id === "second").cwd, "D:\\other");
  });
  await check("legacy background host produces a warning, never kills or injects into running sessions", () => {
    const count = created().length;
    app.sendHost({ type: "init", cwdTrackingSupported: false });
    equal(notice.hidden, false);
    equal(notice.textContent.includes("старой версии"), true);
    equal(created().length, count);
    equal(app.hostMessages.filter((m) => ["kill", "write"].includes(m.type)).length, 0);
    notice.querySelector("button").click();
    equal(notice.hidden, true);
    equal(app.hostErrors.length, 0);
  });
  await check("old environment host warns about PATH without replacing or writing to live shells", () => {
    const count = created().length;
    app.sendHost({ type: "init", cwdTrackingSupported: true, environmentRefreshSupported: false });
    equal(notice.hidden, false);
    equal(notice.textContent.includes("PATH"), true);
    equal(notice.textContent.includes("Сохраните работу"), true);
    equal(created().length, count);
    equal(app.hostMessages.filter((m) => ["kill", "write"].includes(m.type)).length, 0);
    app.sendHost({ type: "init", cwdTrackingSupported: true, environmentRefreshSupported: true });
    equal(notice.hidden, true);
    equal(app.hostErrors.length, 0);
  });
  document.body.dataset.testResult = btoa(unescape(encodeURIComponent(JSON.stringify(results))));
</script>

<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="/node_modules/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="/src/styles.css">
<script src="/node_modules/@xterm/xterm/lib/xterm.js"></script>
<script src="/node_modules/@xterm/addon-search/lib/addon-search.js"></script>
<script type="module">
  import { createTerminalSearch, isSearchShortcut, SEARCH_HIGHLIGHT_LIMIT } from "/src/terminal-search.js";
  const template = new DOMParser().parseFromString(await (await fetch("/index.html")).text(), "text/html")
    .getElementById("terminal-search");
  const results = [];
  const delay = (ms = 250) => new Promise((resolve) => setTimeout(resolve, ms));
  const errors = [];
  window.addEventListener("error", (e) => errors.push(e.message));
  function equal(actual, expected) {
    if (actual !== expected) throw new Error(`Expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
  }
  async function check(name, run) {
    const panel = document.importNode(template, true);
    const host = document.createElement("div");
    host.style.cssText = "position:relative;width:700px;height:220px";
    document.body.append(panel, host);
    const term = new Terminal({ cols: 40, rows: 8, scrollback: 2000, allowProposedApi: true });
    const search = new SearchAddon.SearchAddon({ highlightLimit: SEARCH_HIGHLIGHT_LIMIT });
    term.loadAddon(search);
    term.open(host);
    const data = [];
    term.onData((value) => data.push(value));
    const tab = { term, search };
    const controller = createTerminalSearch({ panel, onVisibilityChange() {} });
    const input = panel.querySelector("[data-search-input]");
    const count = panel.querySelector("[data-search-count]");
    const next = panel.querySelector("[data-search-next]");
    const previous = panel.querySelector("[data-search-previous]");
    const key = (target, key, options = {}) => {
      const event = new KeyboardEvent("keydown", { key, bubbles: true, cancelable: true, ...options });
      target.dispatchEvent(event);
      return event;
    };
    const keyHandler = (event) => controller.handleKeyDown(event);
    window.addEventListener("keydown", keyHandler, true);
    const state = {
      term, search, tab, panel, controller, input, count, next, previous, data, key,
      write: (value) => new Promise((resolve) => term.write(value, resolve)),
      query: async (value) => {
        input.value = value;
        input.dispatchEvent(new Event("input", { bubbles: true }));
        await delay(120);
      }
    };
    try {
      await run(state);
      equal(data.length, 0);
      results.push({ name, ok: true });
    } catch (error) {
      results.push({ name, ok: false, error: error.stack });
    } finally {
      controller.close({ focus: false });
      window.removeEventListener("keydown", keyHandler, true);
      term.dispose();
      panel.remove();
      host.remove();
    }
  }

  await check("shortcut uses physical F in English and Russian layouts", async (s) => {
    for (const key of ["F", "f", "А", "а"]) {
      equal(isSearchShortcut({ key, code: "KeyF", ctrlKey: true, shiftKey: true }), true);
    }
    equal(isSearchShortcut({ key: "f", code: "KeyF", ctrlKey: true }), false);
    equal(isSearchShortcut({ key: "f", code: "KeyF", ctrlKey: true, shiftKey: true, altKey: true }), false);
    s.controller.open(s.tab);
    equal(s.panel.hidden, false);
    equal(document.activeElement, s.input);
    equal(s.count.textContent, "");
    equal(s.next.disabled, true);
  });

  await check("Cyrillic matching, result counts, case toggle and circular navigation", async (s) => {
    await s.write("Ошибка первая\r\nошибка вторая\r\nОшибка третья");
    s.controller.open(s.tab);
    await s.query("Ошибка");
    equal(s.count.textContent, "1 / 3");
    equal(s.term.getSelection(), "Ошибка");
    s.key(s.input, "Enter");
    equal(s.count.textContent, "2 / 3");
    equal(s.term.getSelection(), "ошибка");
    s.key(s.input, "Enter", { shiftKey: true });
    equal(s.count.textContent, "1 / 3");
    s.previous.click();
    equal(s.count.textContent, "3 / 3");
    s.next.click();
    equal(s.count.textContent, "1 / 3");
    s.panel.querySelector("[data-search-case]").click();
    equal(s.count.textContent, "1 / 2");
    equal(s.panel.querySelector("[data-search-case]").getAttribute("aria-pressed"), "true");
  });

  await check("soft-wrapped words and Unicode survive resize; hard rows stay separate", async (s) => {
    await s.write("x".repeat(37) + "проверка" + "\r\n界 e\u0301 пример\r\nраз\r\nрыв");
    s.controller.open(s.tab);
    await s.query("проверка");
    equal(s.count.textContent, "1 / 1");
    equal(s.term.getSelection(), "проверка");
    s.term.resize(32, 8);
    await delay();
    equal(s.count.textContent, "1 / 1");
    equal(s.term.getSelection(), "проверка");
    await s.query("界 e\u0301");
    equal(s.term.getSelection(), "界 e\u0301");
    await s.query("разрыв");
    equal(s.count.textContent, "Нет совпадений");
  });

  await check("empty and absent queries clear highlights; punctuation is literal", async (s) => {
    await s.write("a.b [test] <b>\r\naxb");
    s.controller.open(s.tab);
    await s.query("a.b");
    equal(s.count.textContent, "1 / 1");
    await s.query("missing");
    equal(s.count.textContent, "Нет совпадений");
    equal(s.next.disabled, true);
    equal(s.term.hasSelection(), false);
    await s.query("<b>");
    equal(s.term.getSelection(), "<b>");
    equal(s.panel.querySelector("b"), null);
    await s.query("");
    equal(s.count.textContent, "");
    equal(s.term.markers.length, 0);
  });

  await check("new output refreshes matches without changing focus or sending input", async (s) => {
    await s.write("hello");
    s.controller.open(s.tab);
    await s.query("новое");
    equal(s.count.textContent, "Нет совпадений");
    await s.write("\r\nновое\r\nновое");
    await delay();
    equal(s.count.textContent.endsWith(" / 2"), true);
    equal(s.term.getSelection(), "новое");
    equal(document.activeElement, s.input);
  });

  await check("Escape cancels pending search, removes highlights and restores focus", async (s) => {
    await s.write("match match");
    s.controller.open(s.tab);
    await s.query("match");
    s.input.value = "new query";
    s.input.dispatchEvent(new Event("input"));
    const escaped = s.key(s.input, "Escape");
    equal(escaped.defaultPrevented, true);
    equal(s.panel.hidden, true);
    equal(document.activeElement, s.term.textarea);
    await s.write("\r\nnew query");
    await delay();
    equal(s.term.hasSelection(), false);
    equal(s.term.markers.length, 0);
    s.controller.open(s.tab);
    equal(s.count.textContent, "1 / 1");
    s.panel.querySelector("[data-search-close]").click();
    equal(s.controller.isOpen, false);
  });

  await check("composition Enter/Escape does not navigate or close; edited input stays local", async (s) => {
    await s.write("one one");
    s.controller.open(s.tab);
    await s.query("one");
    equal(s.key(s.input, "Enter", { isComposing: true }).defaultPrevented, false);
    equal(s.count.textContent, "1 / 2");
    s.key(s.input, "Escape", { isComposing: true });
    equal(s.controller.isOpen, true);
    for (const key of ["v", "c", "b", "w", ","]) s.key(s.input, key, { ctrlKey: true });
    equal(s.controller.isOpen, true);
  });

  await check("highlight limit is honest and navigation reaches matches beyond it", async (s) => {
    await s.write(Array.from({ length: 1002 }, () => "hit").join("\r\n"));
    s.controller.open(s.tab);
    await s.query("hit");
    equal(s.count.textContent, "1 / ≥1000");
    s.previous.click();
    equal(s.count.textContent, "— / ≥1000");
    equal(s.term.getSelectionPosition().start.y, 1001);
  });

  await check("alternate buffer and return to normal buffer refresh the search", async (s) => {
    await s.write("normal normal");
    s.controller.open(s.tab);
    await s.query("normal");
    equal(s.count.textContent, "1 / 2");
    await s.write("\x1b[?1049h\x1b[2J\x1b[Hnormal");
    await delay();
    equal(s.term.getSelection(), "normal");
    equal(s.count.textContent, "1 / 1");
    equal(s.next.disabled, false);
    await s.write("\x1b[?1049l");
    await delay();
    equal(s.count.textContent.endsWith(" / 2"), true);
  });

  await check("closing while output refresh is pending does not leak decorations", async (s) => {
    await s.write("hit");
    s.controller.open(s.tab);
    await s.query("hit");
    await s.write("\r\nhit");
    s.controller.close({ focus: false });
    await delay();
    equal(s.term.markers.length, 0);
    equal(s.term.hasSelection(), false);
  });

  await check("closing and immediately disposing a terminal tolerates a pending refresh", async (s) => {
    await s.write("hit");
    s.controller.open(s.tab);
    await s.query("hit");
    await s.write("\r\nhit");
    s.controller.close({ focus: false });
    s.term.dispose();
    await delay();
  });

  await delay();
  results.push({ name: "no uncaught browser errors", ok: errors.length === 0, error: errors.join("\n") });
  document.body.setAttribute("data-test-result", btoa(unescape(encodeURIComponent(JSON.stringify(results)))));
</script>

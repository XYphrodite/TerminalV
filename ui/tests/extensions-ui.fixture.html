<!doctype html>
<meta charset="utf-8">
<style>html, body { margin: 0; height: 100%; } iframe { width: 100%; height: 100%; border: 0; }</style>
<script type="module">
  const source = await (await fetch("/app/index.html")).text();
  const results = [];
  const delay = () => new Promise(resolve => setTimeout(resolve, 100));
  const equal = (actual, expected) => {
    if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error(`Expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
  };
  const frame = document.createElement("iframe");
  const init = { extensionsSupported: true, sessions: [{ id: "live", title: "Live", active: true }], liveIds: ["live"] };
  frame.srcdoc = source.replace("<head>", `<head><base href="${location.origin}/app/"><script>window.testInit = ${JSON.stringify(init)};<\/script><script src="/tests/search-host.js"><\/script><script src="/tests/extensions-host.js"><\/script>`);
  const loaded = new Promise(resolve => frame.addEventListener("load", resolve, { once: true }));
  document.body.append(frame);
  await loaded;
  const app = frame.contentWindow, doc = frame.contentDocument;
  for (let i = 0; i < 20 && !doc.querySelector(".extension-panel-body")?.textContent; i++) await delay();
  async function check(name, action) {
    try { await action(); equal(app.hostErrors, []); results.push({ name, ok: true }); }
    catch (error) { results.push({ name, ok: false, error: error.stack }); }
  }
  await check("built UI imports extension module, mounts panels and renders labels as text", () => {
    equal(app.extensionActivations, 1);
    equal(doc.querySelector("#extension-sidebar .extension-panel-body").textContent, "Count: 0");
    equal(doc.querySelector("#extension-sidebar .extension-panel-title").textContent, "Hello <script>");
    equal(doc.querySelector("#extension-sidebar script"), null);
    equal(doc.querySelector("#extension-settings-panels .extension-panel-body").textContent, "Settings body");
    equal(doc.querySelectorAll("#extension-list .extension-item").length, 2);
    equal(doc.querySelector('[data-extension-toggle="test.invalid"]').disabled, true);
    equal(doc.querySelector("#extension-list img"), null);
  });
  await check("registered command invokes C# route, updates badge and produces safe notification", async () => {
    doc.getElementById("settings-btn").click();
    doc.querySelector(".extension-commands button").click();
    await delay();
    equal(doc.querySelector("#extension-sidebar .extension-panel-body").textContent, "Count: 1");
    equal(doc.querySelector("#extension-sidebar .count-badge").textContent, "1");
    equal(doc.querySelector(".extension-notification div").textContent, "Saved <img>");
    equal(doc.querySelector(".extension-notification img"), null);
    doc.querySelector(".extension-notification button").click();
    equal(doc.querySelector(".extension-notification"), null);
  });
  await check("toggle marks restart required and repeated init does not duplicate panels", async () => {
    doc.querySelector('[data-extension-toggle="test.hello"]').click();
    await delay();
    equal(doc.getElementById("extension-list").textContent.includes("после перезапуска"), true);
    equal(doc.querySelectorAll("#extension-sidebar .extension-panel").length, 1);
    app.sendHost({ type: "init", ...init });
    await delay();
    equal(app.extensionActivations, 1);
    equal(doc.querySelectorAll("#extension-sidebar .extension-panel").length, 1);
    doc.getElementById("extensions-open-folder").click();
    await delay();
    equal(app.hostMessages.some(message => message.type === "extensions:open-folder"), true);
  });
  await check("unsupported hosts hide extension settings", () => {
    app.sendHost({ type: "init", ...init, extensionsSupported: false });
    equal(doc.getElementById("extension-settings").hidden, true);
  });
  document.body.dataset.testResult = btoa(unescape(encodeURIComponent(JSON.stringify(results))));
</script>

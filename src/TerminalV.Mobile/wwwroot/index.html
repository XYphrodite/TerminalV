<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>TerminalV Mobile</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- xterm.js CSS from CDN with local fallback -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" />
    <style>
        /* Isolation: terminal fills available BlazorWebView viewport */
        html, body { margin:0; padding:0; height:100%; background:#0B0D10; overflow:hidden; }
        #app { height:100%; display:flex; flex-direction:column; }
        #terminal-container { flex:1; padding:4px; }
        .xterm { height:100%; }
    </style>
</head>
<body>
    <div id="app">
        <div id="terminal-container"></div>
        <div id="blazor-error-ui" style="display:none; background: #2a3340; color:#E8EEF5; padding:8px;">
            An unhandled error has occurred.
            <a href="" class="reload">Reload</a>
            <a class="dismiss">🗙</a>
        </div>
    </div>

    <!-- Blazor Hybrid WebView bootstrap -->
    <script src="_framework/blazor.webview.js" autostart="false"></script>

    <!-- xterm.js from CDN (isolated, no npm build required) -->
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.12.0/lib/addon-web-links.js"></script>

    <!-- Fallback to local if CDN unavailable (isolation: works offline after first cache) -->
    <script>
        if (typeof Terminal === 'undefined') {
            document.write('<script src="js/xterm.js"><\/script>');
        }
    </script>

    <script src="js/terminal.js"></script>
    <script>
        // Blazor interop isolation: terminal does not depend on Blazor lifecycle
        window.terminalInterop = {
            create: function(id, cols, rows) { return window.TerminalV ? window.TerminalV.create(id, cols, rows) : null; },
            write: function(id, data) { if (window.TerminalV) window.TerminalV.write(id, data); },
            resize: function(id, cols, rows) { if (window.TerminalV) window.TerminalV.resize(id, cols, rows); }
        };
    </script>
</body>
</html>
